[project]
name = "finngraph-core"
version = "0.1.0"
description = "Triplet extraction pipeline for a knowledge graph of business relationships mined from Korean financial and economic news."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flashtext>=2.7",
    "kiwipiepy>=0.23.2",
    "langchain-core>=1.4.8",
    "langchain-google-genai>=4.2.6",
    "langgraph>=1.2.6",
    "neo4j>=6.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
